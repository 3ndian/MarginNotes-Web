<style>
/* Layout: rounded sidebar card + rounded paper sheet floating on a quiet shell; one-column editor, blocks as rows */
:root{
 --shell:#ecebe7; --paper:#fbfbf9; --ink:#25262b; --muted:#8a8b93; --line:#e4e3de; --accent:#3f6fb0; --on-accent:#fff;
 --accent-soft:color-mix(in srgb,var(--accent) 15%,transparent); --pat:color-mix(in srgb,var(--ink) 7%,transparent);
 --danger:#c24b4b; --shadow:0 10px 34px rgba(20,22,30,.14);
 --font-ui:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; --font-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif; --font-mono:'DM Mono',ui-monospace,Menlo,monospace; --fs:17px;--ps:26px;--pw:1px;--lh:26px;--maxw:760px;--r:24px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--shell:#0f1012;--paper:#17181b;--ink:#e9e9ec;--muted:#8d8f98;--line:#2a2c31;--accent:#8fb0e0;--on-accent:#0d0f14;--shadow:0 10px 34px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--shell:#0f1012;--paper:#17181b;--ink:#e9e9ec;--muted:#8d8f98;--line:#2a2c31;--accent:#8fb0e0;--on-accent:#0d0f14;--shadow:0 10px 34px rgba(0,0,0,.5);color-scheme:dark}
:root[data-shade="mist"]{--shell:#ecebe7;--paper:#fbfbf9;--ink:#25262b;--muted:#8a8b93;--line:#e4e3de;--accent:#3f6fb0;--on-accent:#fff;color-scheme:light}
:root[data-shade="linen"]{--shell:#e6dfd1;--paper:#f4efe6;--ink:#33302a;--muted:#948c7c;--line:#ddd5c4;--accent:#a0663a;--on-accent:#fff;color-scheme:light}
:root[data-shade="sage"]{--shell:#dfe5d8;--paper:#eef1e9;--ink:#2b3029;--muted:#7f8a78;--line:#d4dbca;--accent:#4f7a5a;--on-accent:#fff;color-scheme:light}
:root[data-shade="stone"]{--shell:#d6d5d0;--paper:#e7e6e2;--ink:#2a2a2c;--muted:#7b7a76;--line:#cfcdc7;--accent:#3f6a9a;--on-accent:#fff;color-scheme:light}
:root[data-shade="dusk"]{--shell:#141824;--paper:#1d2230;--ink:#e6e9f2;--muted:#8d94aa;--line:#313852;--accent:#86a8ff;--on-accent:#0d0f14;--shadow:0 10px 34px rgba(0,0,0,.5);color-scheme:dark}
:root[data-shade="ink"]{--shell:#050506;--paper:#0d0d0f;--ink:#e8e8ea;--muted:#7d7d85;--line:#232327;--accent:#9ab6ff;--on-accent:#0d0f14;--shadow:0 10px 34px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--shell);color:var(--ink);font-family:var(--font-ui);font-size:15px;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,[contenteditable]:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{display:block;flex:none}
[hidden]{display:none!important}
.txt:focus-visible,.title:focus-visible{outline:none}
.app{display:flex;height:100%}
.gut{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
/* sidebar */
.side{position:fixed;z-index:30;top:calc(10px + env(safe-area-inset-top,0px));bottom:calc(10px + var(--sab,env(safe-area-inset-bottom,0px)));left:max(10px,env(safe-area-inset-left,0px));width:min(310px,86vw);background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;transform:translateX(-125%);transition:transform .25s ease;overflow:hidden}
.side.open{transform:none}
.scrim{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.32)}
.sh{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 6px 18px}
.brand{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-.01em}
.sb{display:flex;gap:6px;padding:4px 10px}
.pill{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:14px;color:var(--muted);flex:1;min-width:0}
.pill:hover,.pill.on{background:var(--accent-soft);color:var(--ink)}
.tree{flex:1;overflow:auto;padding:6px 8px;min-height:0}
.ti{display:flex;align-items:center;gap:2px;border-radius:12px;padding-left:calc(var(--d)*16px)}
.ti:hover{background:var(--accent-soft)}
.ti.on{background:var(--accent-soft);font-weight:600}
.tc{width:26px;height:34px;display:grid;place-items:center;color:var(--muted);transition:transform .15s}
.tc.open{transform:rotate(90deg)}
.tc.none{visibility:hidden}
.tt{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:36px;cursor:pointer}
.tt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt .ic{color:var(--muted)}
.tm{width:32px;height:34px;display:grid;place-items:center;color:var(--muted);border-radius:10px}
.sf{display:flex;gap:6px;padding:8px 10px 12px;border-top:1px solid var(--line)}
.sf .pill{justify-content:center;flex:1;font-size:13px;padding:9px 6px}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;gap:4px;padding-top:8px;padding-bottom:8px}
.ib{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:var(--muted);flex:none}
.ib:disabled{opacity:.35;cursor:default}
@media (max-width:480px){.top .ib{width:36px}}
.ib:hover{background:var(--accent-soft);color:var(--ink)}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:2px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.crumbs::-webkit-scrollbar{display:none}
.crumb{padding:6px 8px;border-radius:10px;color:var(--muted);font-size:14px}
button.crumb:hover{background:var(--accent-soft);color:var(--ink)}
.crumb.now{color:var(--ink);font-weight:600}
.crumbs .ic{color:var(--muted);opacity:.6}
.scroller{flex:1;overflow:auto;margin:0 max(8px,env(safe-area-inset-left,0px)) 8px;border-radius:var(--r);background-color:var(--paper);border:1px solid var(--line);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.p-dots{background-image:radial-gradient(circle at center,var(--pat) var(--pw),transparent calc(var(--pw) + .6px));background-size:var(--ps) var(--ps);background-attachment:local}
.p-lines{background-image:linear-gradient(to bottom,transparent calc(var(--ps) - var(--pw)),var(--pat) calc(var(--ps) - var(--pw)));background-size:100% var(--ps);background-attachment:local}
.p-grid{background-image:linear-gradient(var(--pat) var(--pw),transparent var(--pw)),linear-gradient(90deg,var(--pat) var(--pw),transparent var(--pw));background-size:var(--ps) var(--ps);background-attachment:local}
.page{max-width:var(--maxw);margin:0 auto;padding:26px 14px 40vh}
.title{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,6vw,38px);letter-spacing:-.02em;line-height:1.15;outline:none;margin:6px 0 14px 26px;overflow-wrap:anywhere}
.title:empty::before{content:attr(data-ph);color:var(--muted);opacity:.55}
.sub{margin:0 0 14px 26px;color:var(--muted);font-size:14px}
/* rows */
.row{position:relative;padding-left:26px}
.row[hidden]{display:none}
.row{background-image:repeating-linear-gradient(90deg,transparent 0 12px,var(--line) 12px 13px,transparent 13px 26px);background-size:calc(var(--ind,0)*26px) 100%;background-repeat:no-repeat;background-position:26px 0}
.page.noguides .row{background-image:none}
.grip{position:absolute;left:0;top:2px;width:26px;height:32px;border-radius:8px;touch-action:pan-y;cursor:grab;opacity:.28;}
.grip::before{content:"";position:absolute;left:7px;top:7px;width:12px;height:18px;background:radial-gradient(circle,var(--muted) 1.3px,transparent 1.6px) 0 0/6px 6px}
@media (hover:hover){.grip{opacity:0}.row:hover .grip,.row:focus-within .grip,.selecting .grip{opacity:.7}}
.inner{display:flex;align-items:flex-start;margin-left:calc(var(--ind)*26px);border-radius:10px;padding:4px 6px 4px 0;min-height:calc(var(--lh) + 8px)}
.row.sel .inner{background:var(--accent-soft);box-shadow:-6px 0 0 var(--accent-soft),6px 0 0 var(--accent-soft)}
.row.src{opacity:.35}
.mark{flex:none;width:26px;min-height:var(--lh);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.row[data-type=p] .mark,.row[data-type^=h] .mark,.row[data-type=quote] .mark{display:none}
.row[data-type^=h] .inner,.row[data-type=p] .inner,.row[data-type=quote] .inner{padding-left:2px}
.dot{width:26px;height:var(--lh);display:grid;place-items:center}
.dot i{width:6px;height:6px;border-radius:50%;background:var(--ink)}
.dot.ring i{width:12px;height:12px;background:transparent;border:2px solid var(--ink);box-shadow:0 0 0 3px var(--accent-soft)}
.chev{width:26px;height:var(--lh);display:grid;place-items:center;transition:transform .15s}
.chev.open{transform:rotate(90deg)}
.chk{width:19px;height:19px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;color:var(--on-accent);margin:3px 0}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk svg{opacity:0}.chk.on svg{opacity:1}
.mark hr{width:100%;border:0;border-top:2px solid var(--line);margin:0}
.row[data-type=divider] .mark{width:100%}
.row[data-type=divider] .txt{display:none}
.txt{flex:1;min-width:0;outline:none;white-space:pre-wrap;overflow-wrap:anywhere;font-size:var(--fs);line-height:var(--lh);caret-color:var(--accent)}
.txt:empty::before{content:attr(data-ph);color:var(--muted);opacity:0;pointer-events:none}
.row:focus-within .txt:empty::before{opacity:.6}
.row[data-type^=h] .txt:empty::before{opacity:.45}
.row[data-type=h1] .txt{font-family:var(--font-display);font-weight:700;font-size:1.7em;line-height:1.25;letter-spacing:-.015em;padding-top:8px}
.row[data-type=h2] .txt{font-family:var(--font-display);font-weight:700;font-size:1.38em;line-height:1.3;padding-top:5px}
.row[data-type=h3] .txt{font-weight:700;font-size:1.14em;line-height:1.35;padding-top:2px}
.row[data-type=quote] .txt{border-left:3px solid var(--accent);padding-left:12px;color:var(--muted)}
.row.done .txt{text-decoration:line-through;color:var(--muted)}
.row[data-type=page] .txt{font-weight:600;cursor:pointer;border-bottom:1px solid var(--line)}
.row[data-type=page] .inner{cursor:pointer}
.row.flash .inner{animation:fl 1.6s ease}
@keyframes fl{0%,60%{background:var(--accent-soft)}100%{background:transparent}}
.tail{min-height:30vh;cursor:text}
.kidlist{margin:22px 0 0 26px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.chip{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:14px;background:var(--accent-soft);color:var(--ink);font-size:14px}
/* folder / home cards */
.cards{display:grid;gap:8px;margin-top:6px}
.card{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:18px;transition:background .12s;border:1px solid var(--line);background:var(--paper)}
.card:hover{background:var(--accent-soft)}
.card .ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.card b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .when{flex:none}
.card .ic{color:var(--accent)}
.sec{margin:22px 0 4px 2px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.empty{padding:30px 10px;color:var(--muted);text-align:center;line-height:1.6}
.btnrow{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:14px;background:var(--accent-soft);font-weight:600}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.bad{background:var(--danger);color:#fff}
/* fab, bars */
.fab{position:fixed;z-index:20;right:max(40px,env(safe-area-inset-right,0px));bottom:calc(24px + var(--sab,env(safe-area-inset-bottom,0px)));width:58px;height:58px;border-radius:calc(var(--r)*.8);background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:var(--shadow)}
body.editing .fab,body.selmode .fab,body.dragging .fab{display:none}
.selbar,.acc{position:fixed;z-index:40;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:6px;border-radius:20px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);max-width:calc(100vw - 20px);overflow-x:auto}
.selbar{bottom:calc(18px + var(--sab,env(safe-area-inset-bottom,0px)));align-items:center}
.selbar .cnt{padding:0 10px;font-size:13px;color:var(--muted);white-space:nowrap}
.acc{bottom:0;border-radius:20px;width:calc(100% - 16px);max-width:calc(100% - 16px);justify-content:space-around;margin-bottom:8px}
@media (hover:hover) and (pointer:fine){.acc{display:none!important}}
.ib.bad{color:var(--danger)}
.pop{position:fixed;z-index:50;width:min(300px,calc(100vw - 20px));max-height:min(340px,45vh);overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:6px}
.pi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 10px;border-radius:12px}
.pi.on,.pi:hover{background:var(--accent-soft)}
.pg{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.pi small{display:block;color:var(--muted)}
.ghost{position:fixed;z-index:70;left:0;top:0;pointer-events:none;background:var(--paper);border:1px solid var(--accent);border-radius:14px;padding:8px 12px;box-shadow:var(--shadow);max-width:260px;font-size:14px}
.ghost div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghost b{position:absolute;right:-8px;top:-8px;background:var(--accent);color:var(--on-accent);border-radius:12px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px}
.dropline{position:fixed;z-index:65;height:3px;border-radius:2px;background:var(--accent);pointer-events:none}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
.selecting .txt{user-select:none;-webkit-user-select:none;pointer-events:none}
.selecting .inner{cursor:pointer}
/* sheet */
.sw{position:fixed;inset:0;z-index:60}
.sw .bg{position:absolute;inset:0;background:rgba(0,0,0,.36)}
.sheet{position:absolute;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(8px + var(--sab,env(safe-area-inset-bottom,0px)));max-height:82vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:calc(var(--r) + 2px);padding:18px;box-shadow:var(--shadow)}
@media (min-width:700px){.sheet{left:50%;right:auto;bottom:auto;top:12vh;width:460px;transform:translateX(-50%)}}
.sheet h3{margin:0 0 12px;font-family:var(--font-display);font-size:20px}
.sheet .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:14px}
.sheet .opt:hover{background:var(--accent-soft)}
.sheet .opt.bad{color:var(--danger)}
.inp{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--shell);color:var(--ink);font:inherit;font-size:16px}
textarea.inp{height:110px;font-family:var(--font-mono);font-size:12px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.seg button{padding:9px 14px;border-radius:12px;border:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.sw-sw{display:flex;align-items:center;gap:8px}
.sw-sw i{width:16px;height:16px;border-radius:50%;border:1px solid var(--line);display:block}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.res{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:14px}
.res:hover{background:var(--accent-soft)}
.res .path{font-size:12px;color:var(--muted);margin-bottom:2px}
.res .sn{font-size:14px;color:var(--muted);margin-top:2px}
mark{background:var(--accent-soft);color:var(--ink);border-radius:4px;padding:0 1px}
.toast{position:fixed;z-index:80;left:50%;bottom:calc(90px + var(--sab,env(safe-area-inset-bottom,0px)));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:14px;font-size:14px}
@media (min-width:900px){
 .side{position:relative;inset:auto;transform:none;margin:10px 0 10px max(10px,env(safe-area-inset-left,0px));flex:none;width:290px;transition:none;box-shadow:none}
 .side.closed{display:none}.scrim{display:none!important}
 .scroller{margin-right:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.banner{flex:none;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin:0 max(8px,env(safe-area-inset-left,0px)) 8px;padding:10px 14px;border-radius:18px;background:var(--accent-soft);border:1px solid var(--line);font-size:14px}
.banner .bn{display:flex;gap:6px}.banner .btn{padding:7px 12px}
.badge{margin-left:8px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--on-accent);color:var(--accent);font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.sf{flex-wrap:wrap}.sf .pill.save{flex:1 1 100%;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:14px}
.saverow{flex:1 1 100%;display:flex;gap:6px}.sf .saverow .pill.save{flex:1 1 auto}.optb{background:var(--accent-soft);color:var(--ink);flex:none}
.sfnote{flex:1 1 100%;text-align:center;font-size:12px;color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin:4px 0 12px;line-height:1.45}
.crow{display:flex;gap:10px;align-items:center;margin:8px 0}.crow input{width:20px;height:20px;accent-color:var(--accent)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;border-radius:9px;background:var(--trk,var(--line));margin:8px 0;outline-offset:3px;touch-action:pan-y}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--paper);border:3px solid var(--ink)}
.sl{display:block;margin:8px 0}.sl span{display:flex;justify-content:space-between;font-size:14px}.sl b{font-weight:600;font-variant-numeric:tabular-nums}
.prev{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background-color:var(--paper);margin:0 0 8px;font-size:15px}

const FXB=300;
function crc32(u8){let c=-1;for(let i=0;i<u8.length;i++){c^=u8[i];for(let k=0;k<8;k++)c=(c>>>1)^(0xEDB88320&-(c&1))}return((c^-1)>>>0).toString(16).padStart(8,'0')}

function maskFor(tid,K,idx){
 const m=new Uint8Array((K+7)>>3);
 if(idx<K){m[idx>>3]|=1<<(idx&7);return m}
 const r=mulberry(seedOf(tid,idx));let any=false;
 for(let i=0;i<K;i++)if(r()<.5){m[i>>3]|=1<<(i&7);any=true}
 if(!any){const i=idx%K;m[i>>3]|=1<<(i&7)}return m;

const bit=(m,i)=>(m[i>>3]>>(i&7))&1;

/* ---- sender ---- */
async function fxPrepare(u8,B){
 B=B||FXB;const K=Math.ceil(u8.length/B),blocks=[];
 for(let i=0;i<K;i++){const b=new Uint8Array(B);b.set(u8.subarray(i*B,(i+1)*B));blocks.push(b)}

}
function fxFrame(c,idx){
 const m=maskFor(c.tid,c.K,idx),d=new Uint8Array(c.B||FXB);
 for(let i=0;i<c.K;i++)if(bit(m,i))xorInto(d,c.blocks[i]);
 const head=`MNF1|${c.tid}|${c.K}|${c.len}|${c.B||FXB}|${c.crc}|${idx}|${b64u(d)}`;

}
/* ---- receiver ---- */
let FX={};
function fxParse(t){
 const p=t.split('|');if(p.length!==9||p[0]!=='MNF1')return null;
 if(fnv(p.slice(0,8).join('|'))!==p[8])return null;

 if(!(K>0&&K<=4000&&len>0&&len<=8000000&&B>=50&&B<=1000&&Math.ceil(len/B)===K&&idx>=0&&idx<1e7))return null;
 if(!/^[A-Za-z0-9_-]{6}$/.test(p[1])||!/^[0-9a-f]{8}$/.test(p[5]))return null;

async function fxLoad(f){

 st={tid:f.tid,K:f.K,len:f.len,B:f.B,crc:f.crc,piv:new Array(f.K).fill(null),rank:0,t:Date.now()};
 try{const sv=await idbGet('qrx:'+f.tid);if(sv&&sv.K===f.K&&sv.len===f.len&&sv.crc===f.crc&&Array.isArray(sv.rows)){sv.rows.forEach(r=>{const i=r.lead;if(i>=0&&i<f.K&&!st.piv[i]){st.piv[i]={mask:r.mask,data:r.data};st.rank++}});st.t=sv.t||st.t}}catch(e){}

function fxAdd(st,mask,data){

let fxSaveT=null;

 /* ---------- saving: pick a place when the device allows it ---------- */
 async function saveTo(blob,name){
  const mime=blob.type||'application/octet-stream';
  try{
   if(window.NativeBridge&&NativeBridge.saveFile){
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)});
    const ok=await new Promise(res=>{window.__nativeDone=res;NativeBridge.saveFile(name,mime,b64)});if(ok)toast('Saved');return;
   }
   if(window.showSaveFilePicker){
    const ext=name.slice(name.lastIndexOf('.'));
    const h=await window.showSaveFilePicker({suggestedName:name,types:[{description:mime,accept:{[mime]:[ext]}}]});
    const w=await h.createWritable();await w.write(blob);await w.close();toast('Saved');return;
   }
   const f=new File([blob],name,{type:mime});
   if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}
   const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Downloaded');
  }catch(e){if(e&&e.name==='AbortError')return;toast('Could not save')}
 }

 const modeSlug=m=>(m&&m.name||'sstv').toLowerCase().replace(/\s+/g,'');

 /* ---------- screen ---------- */
 function open(tab){
  try{closeSide()}catch(e){}

  const el=document.createElement('div');el.id='sstv';
  el.innerHTML=`<div class="ss_sh"><h2>SSTV</h2><button class="ss_sx" data-ss="close" aria-label="Close">✕</button></div>

 /* ---------- the roll: every received picture stacks up here, saved until you clear it ---------- */
 let ROLL=null,rollT=0,rollLoading=null;const ROLLK='sstv-roll',ROLLMAX=60;
 function rollLoad(){
  if(ROLL)return;if(rollLoading)return;
  rollLoading=idbGet(ROLLK).then(r=>{ROLL=Array.isArray(r)?r.filter(x=>x&&typeof x.png==='string'&&x.png.startsWith('data:image/png')&&x.h>0&&x.h<=1024):[];rollLoading=null;if(ST){drawRoll();syncBtns()}});
 }
 function rollSave(){clearTimeout(rollT);rollT=setTimeout(()=>{try{idbSet(ROLLK,ROLL)}catch(e){}},300)}
 function pngUrl(img){
  const c=document.createElement('canvas');c.width=W;c.height=img.h;const x=c.getContext('2d'),im=x.createImageData(W,img.h);
  for(let i=0,j=0;i<im.data.length;i+=4,j+=3){im.data[i]=img.rgb[j];im.data[i+1]=img.rgb[j+1];im.data[i+2]=img.rgb[j+2];im.data[i+3]=255}
  x.putImageData(im,0,0);return c.toDataURL('image/png');
 }
 function pushRoll(img,partial){
  if(!ROLL)ROLL=[];
  ROLL.push({id:uid(),ts:Date.now(),h:img.h,mode:(img.mode&&img.mode.name)||'SSTV',part:!!partial,png:pngUrl(img)});
  while(ROLL.length>ROLLMAX){const g=ROLL.shift();if(ST)ST.rsel.delete(g.id)}
  ST.live=false;rollSave();drawRoll();
  const w=$$('sswin'),wt=$$('sswait');if(w&&!ST.noFollow)w.scrollTop=w.scrollHeight;
 }
 function drawRoll(){
  const r=$$('ssroll');if(!r||!ST)return;
  const list=ROLL||[],idle=!ST.live;
  r.innerHTML=list.map((x,i)=>{const t=new Date(x.ts),hm=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
   return `<div class="ss_it${ST.rsel.has(x.id)?' sel':''}" data-id="${x.id}"><img src="${x.png}" data-ss="item" data-id="${x.id}" alt="Picture ${i+1}"><span class="ss_bd">${esc(x.mode)}${x.part?' · partial':''} · ${hm}</span><button class="ss_ck" data-ss="chk" data-id="${x.id}" aria-label="Select picture ${i+1}">${ST.rsel.has(x.id)?'✓':''}</button><button class="ss_dx" data-ss="del" data-id="${x.id}" aria-label="Remove picture ${i+1}">✕</button></div>`}).join('');
  const lv=$$('sslive'),wt=$$('sswait');
  if(lv)lv.hidden=!(ST.live||!list.length);
  if(wt)wt.hidden=!(idle&&list.length&&ST.listening);
  const n=ST.rsel.size,c=$$('sscount'),sl=$$('sssel');
  if(c)c.textContent=list.length?'· '+list.length:'';
  if(sl)sl.textContent=n?`${n} selected. Save puts ${n>1?'them':'it'} in ${n>1?'one tall image, top to bottom':'a single image'}.`:'Tap the circle on a picture to select it. They stay here until you clear them.';
  syncBtns();
 }
 function selected(){return (ROLL||[]).filter(x=>ST.rsel.has(x.id))}
 async function stitch(items){
  const gap=items.length>1?6:0,cap=16000;let tot=0,use=[];
  for(const it of items){if(tot+it.h+(use.length?gap:0)>cap)break;tot+=it.h+(use.length?gap:0);use.push(it)}
  const c=document.createElement('canvas');c.width=W;c.height=tot;const x=c.getContext('2d');x.fillStyle='#111';x.fillRect(0,0,W,tot);
  let y=0;for(const it of use){const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=it.png});x.drawImage(im,0,y);y+=it.h+gap}
  const bl=await new Promise(r=>c.toBlob(r,'image/png'));return {blob:bl,n:use.length,h:tot};
 }
 async function outBlob(){
  const sel=selected();
  if(sel.length){const o=await stitch(sel);if(o.n<sel.length)toast('Too long for one image: used the first '+o.n);return {blob:o.blob,h:o.h,name:sel.length>1?'roll-'+sel.length:'selected'}}
  if(ST.live&&ST.shown){return {blob:await pngOf(ST.shown),h:ST.shown.h,name:modeSlug(ST.shown.mode)}}
  const last=(ROLL||[]).slice(-1);if(last.length){const o=await stitch(last);return {blob:o.blob,h:o.h,name:modeSlug({name:last[0].mode})}}
  if(ST.shown)return {blob:await pngOf(ST.shown),h:ST.shown.h,name:modeSlug(ST.shown.mode)};
  return null;
 }

 function drawRecv(){
  const b=$$('ssb');
  b.innerHTML=`<div class="ss_cols"><div class="ss_view"><div class="ss_win" id="sswin"><div id="ssroll"></div><div id="sslive"><canvas class="ss_pic" id="sscv" width="320" height="240" data-ss="full" style="cursor:zoom-in"></canvas></div><div class="ss_wait" id="sswait" hidden>The next picture appears here</div></div>
  <div class="ss_st" id="sstx">Not listening</div><p class="ss_sub" id="sssub"></p>
  <div class="ss_bar"><i id="ssbar"></i></div><div class="ss_lv"><i id="sslv"></i></div></div><div class="ss_ctl"><p class="hint">Hold this device near a speaker or radio playing a slow-scan picture. It draws as it arrives. Keep it quiet. Tap the picture to see it full screen.</p>
  <div class="ss_row"><button class="ss_tb pri" data-ss="listen" id="sslisten">${ic('recv',18)}Listen</button><button class="ss_tb" data-ss="pause" id="sspause" disabled>Pause</button><button class="ss_tb" data-ss="clear" id="ssclear">Clear all</button></div>
  <h4>Pictures in the roll <span id="sscount"></span></h4><p class="hint" id="sssel">Tap the circle on a picture to select it. They stay here until you clear them.</p>
  <div class="ss_chips" id="sspick"><button data-ss="seln" data-v="2">Last 2</button><button data-ss="seln" data-v="3">Last 3</button><button data-ss="seln" data-v="5">Last 5</button><button data-ss="seln" data-v="all">All</button><button data-ss="seln" data-v="0">None</button></div>
  <div class="ss_row"><button class="ss_tb" data-ss="save" id="sssave" disabled>${ic('dl',18)}Save…</button><button class="ss_tb" data-ss="more" id="ssmore" disabled>Copy or add to a page</button></div>
  <h4>Missed the start?</h4><p class="hint">Pick the mode, then tap Start now. It begins at the next line it hears.</p>
  <div class="ss_chips" id="sschips">${MODEL.map(m=>`<button data-ss="mode" data-v="${m[0]}">${m[1]}</button>`).join('')}</div>
  <div class="ss_row"><button class="ss_tb" data-ss="force" id="ssforce" disabled>Start now</button><button class="ss_tb" data-ss="file">Decode a recording…</button></div>
</div></div>`;
  const cv=$$('sscv'),cx=cv.getContext('2d');cx.fillStyle='#000';cx.fillRect(0,0,320,240);
  if(ST.live&&ST.shown){cv.height=ST.shown.h;paintImg(ST.shown.rgb,ST.shown.h)}
  syncBtns();drawRoll();rollLoad();

 function paintImg(rgb,h,line){
  for(const id of ['sscv','ssfullcv']){
   const cv=$$(id);if(!cv||cv.dataset.static)continue;if(cv.height!==h)cv.height=h;
   const cx=cv.getContext('2d'),im=cx.createImageData(W,h),o=im.data;
   for(let i=0,j=0;i<o.length;i+=4,j+=3){o[i]=rgb[j];o[i+1]=rgb[j+1];o[i+2]=rgb[j+2];o[i+3]=255}
   cx.putImageData(im,0,0);
  }
  const win=$$('sswin'),lv=$$('sslive');
  if(win&&lv&&line!=null&&ST&&!ST.noFollow&&win.scrollHeight>win.clientHeight+4){const cv=$$('sscv');win.scrollTop=Math.max(ROLL&&ROLL.length?lv.offsetTop-44:0,lv.offsetTop+cv.clientHeight*(line/h)-win.clientHeight*0.8)}
 }
 /* full-screen viewer: scales to fit, pinch or scroll to zoom, drag to move; keeps updating while a picture arrives */

  el.style.cssText='position:fixed;inset:0;z-index:55;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none';

   else if(pt.size>=2){const a=[...pt.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;

  document.body.appendChild(el);if(!item&&ST.shown)paintImg(ST.shown.rgb,ST.shown.h);

  f.disabled=!ST.listening||!ST.pick||(ST.dec&&ST.dec.state==='image');
  const has=!!(ST.shown||(ROLL&&ROLL.length));s.disabled=!has;m.disabled=!has;
  const n=ST.rsel?ST.rsel.size:0;s.lastChild.textContent=n>1?`Save ${n} as one…`:n===1?'Save selected…':'Save…';

 const say=(t,sub)=>{const a=$$('sstx'),b=$$('sssub');if(a&&t!=null)a.textContent=t;if(b&&sub!=null)b.textContent=sub};
 function newDecoder(rate){
  const d=new E.Decoder(rate);

   if(!ST||ST.dec!==d)return;
   const h=dd.mode.h||E.H;
   if(k==='vis'){ST.shown=null;ST.noFollow=false;ST.live=true;say('Receiving '+dd.mode.name+'…','Header heard. The picture draws line by line.');const cv=$$('sscv');if(cv){cv.height=h;const cx=cv.getContext('2d');cx.fillStyle='#000';cx.fillRect(0,0,W,h)}drawRoll();

    const w0=$$('sswin'),lv=$$('sslive');if(w0&&lv)w0.scrollTop=ROLL&&ROLL.length?Math.max(0,lv.offsetTop-44):0;syncBtns();return}
   ST.shown={rgb:dd.rgb.slice(0,W*h*3),h,mode:dd.mode};paintImg(dd.rgb,h,dd.line);

   if(k==='done'){

    try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}
    pushRoll(ST.shown,false);
